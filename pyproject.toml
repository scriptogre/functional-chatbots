# Project
# --------------------------------
[project]
name = "functional-chatbots"
version = "0.2.0"
description = "Functional LLM Chatbots demo from DjangoCon Europe 2024, refreshed for 2026."
authors = [{ name = "Christian Tanul", email = "tanulchristian@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "Django>=6.0",
    "django-environ>=0.13",
    "django-ninja>=1.6.2",
    "django-jinja>=2.11",
    "django-htmx>=1.27",
    "whitenoise>=6.12",
    "openai>=2.41",
    "pydantic>=2.13",
]

[project.optional-dependencies]
local = [
    "watchfiles>=1.2",
    "django-extensions>=4.1",
    "ruff>=0.15",
]
production = [
    "granian>=2.7.5",
]


# ruff
# --------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "staticfiles", "*/migrations/*"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
